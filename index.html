@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(inter-700.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;font-display:swap;src:url(inter-800.woff2) format("woff2")}
@font-face{font-family:"Klee One";font-weight:600;font-display:swap;src:url(klee.woff2) format("woff2")}
:root{--bg:#0f1016;--ink:#f4f1ea;--mute:#8b8e9b;--dim:#5a5d69;--surf:rgba(255,255,255,.045);--surf2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--acc:#ff5a45;--ok:#3ddc97;--bad:#ff5468;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.kf{font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Klee One","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;contain:strict;transform:translateZ(0)}
.sun{position:absolute;left:50%;top:-18vh;width:120vh;height:120vh;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,90,69,.22) 0%,rgba(255,90,69,.07) 35%,transparent 62%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.06);opacity:.85}}
.wm{position:absolute;right:-12vh;bottom:-14vh;font-size:78vh;line-height:1;color:#fff;opacity:.035;animation:wm .6s ease-out both;will-change:opacity}
@keyframes wm{from{opacity:0}}
@keyframes drift{to{transform:translate(-3vh,-2vh) rotate(2deg)}}
.grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.6) .6px,transparent .6px);background-size:3px 3px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px;transition:background .2s}
.back:hover{background:var(--surf2)}
.lft{display:flex;align-items:center;gap:12px}
.logo{white-space:nowrap}
@media(max-width:460px){.logo span{display:none}.pills{gap:6px}.pill{padding:7px 10px}}
.lang{display:flex;padding:3px;border-radius:99px;background:var(--surf);border:1px solid var(--line)}
.lang button{font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border:0;border-radius:99px;background:transparent;color:var(--mute);cursor:pointer;transition:all .2s}
.lang button.on{background:var(--acc);color:#fff}
.snd{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.snd svg{width:18px;height:18px}
.topr{display:flex;gap:8px;align-items:center}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.02em}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.pill b{color:var(--ink);font-weight:700}
.pill.hot{color:var(--acc);border-color:rgba(255,90,69,.4);background:rgba(255,90,69,.1)}
.pill.hot b{color:var(--acc)}
.pill.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
button.pill{cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.prog{margin-top:22px}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:8px;letter-spacing:.04em}
.prog .lab b{color:var(--ink)}
.track{height:6px;border-radius:6px;background:var(--surf2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff8a5c,var(--acc));box-shadow:0 0 12px rgba(255,90,69,.6);transition:width .6s var(--ease)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.orb{position:relative;width:min(72vw,300px,38vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.07),rgba(255,255,255,.015) 70%);border:1px solid var(--line);animation:orbIn .5s var(--ease) both}
@keyframes orbIn{from{transform:scale(.94);opacity:.4}}
.orb svg{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg)}
.orb circle{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.orb.ok circle{stroke:var(--ok);animation:draw .55s var(--ease) forwards}
.orb::after{content:"";position:absolute;inset:-18%;border-radius:50%;pointer-events:none;background:radial-gradient(circle closest-side,transparent 70%,rgba(61,220,151,.22) 78%,transparent 100%);opacity:0;transition:opacity .45s}
.orb.ok::after{opacity:1}
.orb.bad::after{background:radial-gradient(circle closest-side,transparent 70%,rgba(255,84,104,.2) 78%,transparent 100%);opacity:1}
.orb.bad circle{stroke:var(--bad);stroke-dashoffset:0;animation:fadeIn .2s both}
.orb.bad{animation:shake .4s ease}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
.orb .k{font-size:min(36vw,150px,19vh);line-height:1;animation:stamp .45s var(--ease) both;will-change:transform,opacity}
@keyframes stamp{from{opacity:0;transform:scale(1.3)}}
.orb.ok .k{color:var(--ok);transition:color .25s}
.ans{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:700;color:var(--bad);letter-spacing:.03em;animation:up .3s var(--ease) both}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;font:inherit;font-size:26px;font-weight:600;height:clamp(64px,10vh,84px);border-radius:20px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,opacity .25s,transform .15s;animation:optIn .45s var(--ease) both}
.opt:nth-child(1){animation-delay:.12s}.opt:nth-child(2){animation-delay:.17s}.opt:nth-child(3){animation-delay:.22s}.opt:nth-child(4){animation-delay:.27s}
@keyframes optIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
.opt small{position:absolute;top:9px;left:12px;font-size:11px;font-weight:600;color:var(--dim)}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.22);background:var(--surf2)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.ok{background:rgba(61,220,151,.14);border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 4px rgba(61,220,151,.08);animation:pop .4s var(--spring)}
.opt.bad{background:rgba(255,84,104,.13);border-color:var(--bad);color:var(--bad);animation:shake .4s ease}
.opt.off{opacity:.35}
.opt.ok small,.opt.bad small{color:inherit;opacity:.7}
@keyframes pop{45%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.foot{height:74px;display:flex;align-items:flex-end}
.btn{width:100%;height:58px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,90,69,.35);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn.in{animation:up .35s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.leave .orb,.leave .opts{animation:leave .22s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(-28px)}}
.leave .orb{animation-name:leaveO}
@keyframes leaveO{to{opacity:0;transform:scale(.9)}}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .big{font-size:min(22vw,104px);line-height:1.05;position:relative}
.hero .big span{display:inline-block;animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) rotate(-6deg)}}
.hero h2{font-size:min(9vw,40px);font-weight:800;letter-spacing:-.02em;margin:26px 0 8px;animation:up .5s var(--ease) .35s both}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;color:var(--mute);font-size:15px;animation:up .5s var(--ease) .45s both}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chips.a{animation:up .5s var(--ease) .55s both}
.chip{font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(255,90,69,.1)}
.setup{margin:30px 0 0}
.foot2{display:flex;flex-direction:column;gap:12px;animation:up .5s var(--ease) .65s both}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px}
.ring{position:relative;width:min(58vw,230px);aspect-ratio:1;animation:orbIn .5s var(--ease) both}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:var(--surf2)}
.ring .fg{stroke:var(--acc);stroke-dasharray:100}
.ring::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle closest-side,transparent 68%,rgba(255,90,69,.2) 78%,transparent 100%)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:min(15vw,60px);font-weight:800;letter-spacing:-.03em}
.ring .c span{font-size:14px;color:var(--mute);font-weight:600}
.end h2{margin-top:22px}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;animation:up .5s var(--ease) .5s both}
.miss span{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mute)}
.miss b{font-size:22px;color:var(--ink);font-weight:600}
.hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}
@media(max-width:520px),(max-height:700px){.hint{display:none}}
.ov{position:fixed;inset:0;background:rgba(15,16,22,.97);overflow:auto;padding:20px;display:none;z-index:10}
.ov.on{display:block;animation:fadeIn .2s both}
.ovin{max-width:560px;margin:0 auto}
.ovtop{z-index:3;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:-20px;background:rgba(15,16,22,.97);padding:10px 0}
.ovtop h1{font-size:16px;margin:0}
table.tb{border-collapse:separate;border-spacing:5px;width:100%;table-layout:fixed;margin-bottom:22px}
.tb th{font-size:12px;color:var(--mute);font-weight:600;padding:2px;width:9%}
.tb td{background:var(--surf);border:1px solid var(--line);border-radius:12px;height:62px;position:relative;text-align:center;font-size:30px}
.tb td small{position:absolute;right:7px;bottom:4px;font-size:11px;font-family:Inter,system-ui,sans-serif;font-weight:600;color:var(--mute)}
.tb td.e{background:transparent;border:0}
.ov h2{font-size:12px;color:var(--mute);margin:6px 0;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tap{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;z-index:50;animation:tap .45s ease-out forwards}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}

.wm{color:var(--ink);opacity:.045}
.logo i{border-radius:4px;box-shadow:none;width:13px;height:13px}
.back{background:var(--surf);color:var(--ink)}
.back:hover{background:var(--surf2)}
.pill{background:var(--surf);color:var(--mute)}
.pill.hot{background:rgba(200,55,45,.08)}
.lang{background:var(--surf)}
.track{background:rgba(34,29,23,.08)}
.track i{background:var(--acc);box-shadow:none}
.orb{background:var(--surf);border:1px solid var(--line);box-shadow:0 10px 24px -16px rgba(60,40,20,.35)}
.orb::after{display:none}
.orb svg{inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px)}
.orb circle{stroke-width:3.2}
.orb.ok circle{stroke:var(--good)}
.orb.ok .k{color:var(--ink)}
.orb.bad circle{stroke:var(--wrong)}
.ans{color:var(--acc)}
.opt{background:var(--surf);color:var(--ink);box-shadow:0 2px 0 rgba(34,29,23,.06)}
.opt small{color:var(--dim)}
.opt:hover:not(:disabled){background:var(--surf2);border-color:rgba(34,29,23,.28)}
.opt.ok{background:rgba(47,143,84,.12);border-color:var(--good);color:var(--good);box-shadow:0 0 0 4px rgba(47,143,84,.1)}
.opt.bad{background:rgba(200,55,45,.1);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through;text-decoration-thickness:2px}
.opt.off{opacity:.4}
.btn{background:var(--acc);box-shadow:0 3px 0 #922820}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #922820}
.hero h2 em{color:var(--acc)}
.chip{color:var(--mute)}
.chip.on{background:rgba(200,55,45,.07)}
.ring::before{display:none}
.ring .bgc{stroke:rgba(34,29,23,.09)}
.ring .fg{stroke:var(--acc)}
.miss span{background:var(--surf)}
.ov{background:rgba(243,238,227,.98)}
.ovtop{background:rgba(243,238,227,.98)}
.tb td{background:var(--surf)}
.tap{background:rgba(34,29,23,.2)}
.inst{display:none;width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:16px;font-weight:700;cursor:pointer;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 0 rgba(34,29,23,.06)}
.inst.on{display:flex}
.inst svg{width:20px;height:20px}
.sheetbg{position:fixed;inset:0;background:rgba(34,29,23,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheetbg.on{display:flex;animation:fadeIn .2s both}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));animation:up .3s var(--ease) both}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:800}
.sheet p{margin:0 0 18px;color:var(--mute);font-size:14px}
.sheet ol{margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
.sheet li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.sheet li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.sheet b{font-weight:700}
.pnote{font-size:13px;color:var(--mute);margin:6px 0 12px}
.tvs{justify-content:flex-start;margin:0 0 14px;position:sticky;top:34px;z-index:2;background:rgba(243,238,227,.98);padding:6px 0}
.pnote b{color:var(--acc)}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.pc{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pk{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(200,55,45,.08);color:var(--acc);display:grid;place-items:center;font-size:28px}
.pb{min-width:0}
.pm{font-size:14px;color:var(--ink)}
.pm b{color:var(--acc);font-weight:800}
.pe{font-size:13px;color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;gap:0 8px}
.pe .kf{color:var(--ink);font-size:15px}
.cc{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;background:var(--surf2);border:1px solid var(--line);border-radius:18px;padding:16px;z-index:30;box-shadow:0 12px 40px -12px rgba(60,40,20,.35);animation:up .35s var(--ease) both}
.cc p{margin:0 0 12px;font-size:13.5px;line-height:1.45;color:var(--mute)}
.cc div{display:flex;gap:8px}
.cc button{flex:1;height:44px;border-radius:12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.cc button.y{background:var(--acc);border-color:var(--acc);color:#fff}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.orb.ok circle{stroke-dashoffset:0}}
</style>
</head>

ovh:"Kana chart",close:"Close",tb1:"Basic",tb2:"Dakuten / handakuten",hint:"Keys 1–4 pick an answer · Enter / space — next · Esc — menu",title:"Hiragana & Katakana quiz",back:"Back to menu",install:"Get the app",ok:"Got it",iosT:"Install on iPhone",iosP:"The app goes on your home screen and works offline.",ios:["Tap <b>Share</b> in Safari's bottom bar","Scroll and choose <b>Add to Home Screen</b>","Tap <b>Add</b> in the top right corner"],andT:"Install the app",andP:"The app goes on your home screen and works offline.",and:["Open the browser menu <b>⋮</b>","Choose <b>Install app</b> or <b>Add to Home screen</b>","Confirm with <b>Install</b>"]}};
let lang="pl";try{const v=localStorage.getItem("hq-lang");if(v==="en"||v==="pl")lang=v;else if(!(navigator.language||"").startsWith("pl"))lang="en"}catch(e){}
const T=k=>L[lang][k];
function applyLang(){document.documentElement.lang=lang;document.title=T("title");document.getElementById("ovh").textContent=T("ovh");document.getElementById("ovx").textContent=T("close");document.getElementById("hint").textContent=T("hint");buildTable()}
function setLang(l){lang=l;try{localStorage.setItem("hq-lang",l)}catch(e){}applyLang();intro()}
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
let sndOn=true;try{sndOn=localStorage.getItem("hq-snd")!=="0"}catch(e){}
let actx=null;
function track(n,p){try{if(window.gtag)gtag("event",n,p||{})}catch(e){}}
function sfx(kind){
  if(!sndOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime,out=actx.createGain();out.gain.value=.5;out.connect(actx.destination);
    const tone=(f,st,dur,vol,type)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(vol,t+st+.008);g.gain.exponentialRampToValueAtTime(.0001,t+st+dur);o.connect(g);g.connect(out);o.start(t+st);o.stop(t+st+dur+.05)};
    if(kind==="ok"){tone(1318.5,0,.45,.35);tone(1975.5,.07,.55,.28)}
    else if(kind==="bad"){tone(196,0,.28,.3,"triangle");tone(185,0,.28,.25,"triangle");tone(147,.12,.3,.25,"triangle")}
    else if(kind==="end"){[659.3,784,987.8,1318.5].forEach((f,i)=>tone(f,i*.09,.9,.25))}
    else if(kind==="tap"){tone(2400,0,.04,.12)}
  }catch(e){}
}
const app=document.getElementById("app"),wm=document.getElementById("wm");
let script="hira";try{const v=localStorage.getItem("hq-script");if(v==="kata"||v==="both")script=v}catch(e){}
let mode="base",order="rand",pool=[],queue=[],idx=0,score=0,streak=0,best=0,answered=false,wrong=[],cur=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const toK=c=>c===" "?c:String.fromCharCode(c.charCodeAt(0)+96);
const KBASE=BASE.map(x=>[toK(x[0]),x[1]]),KDAK=DAK.map(x=>[toK(x[0]),x[1]]);
const CONF_H=["きさち","ぬめ","ねれわ","るろ","うら","をとち","はほけ","まも","にこ","いり","しつ","あおめ","くへ","すむ","ねぬ","たな"];
const CONF_K=["シツ","ソン","ノメ","クワウ","コユ","チテ","スヌ","フワ","アマ","ナメ","タク","ルレ","セサ","ヲフ","ロコ"];
const confPool=g=>{const seen=new Set(),out=[];g.forEach(x=>[...x].forEach(c=>{if(!seen.has(c)){seen.add(c);out.push([c,RM[c]])}}));return out};
const confMates=c=>{const out=[];CONF_H.concat(CONF_K).forEach(x=>{if(x.includes(c))[...x].forEach(m=>{if(m!==c&&!out.includes(m))out.push(m)})});return out};
const setOf=(b,d,g)=>mode==="base"?b:mode==="dak"?d:mode==="conf"?confPool(g):b.concat(d);
const getPool=()=>script==="hira"?setOf(BASE,DAK,CONF_H):script==="kata"?setOf(KBASE,KDAK,CONF_K):setOf(BASE,DAK,CONF_H).concat(setOf(KBASE,KDAK,CONF_K));
const bigLabel=()=>script==="kata"?"カタカナ":script==="both"?"かなカナ":"ひらがな";
const wmFirst=()=>script==="kata"?"ア":"あ";
function setWm(c){wm.textContent=c;wm.style.animation="none";void wm.offsetWidth;wm.style.animation=""}
function topBar(){return`<div class="top"><div class="lft"><button class="back" id="back" title="${T("back")}" aria-label="${T("back")}">‹</button><div class="logo"><i></i><span>${bigLabel()}</span></div></div><div class="pills"><div class="pill" id="sc">${T("score")} <b>${score}</b></div><div class="pill ${streak>=3?"hot":""}" id="st">${T("streak")} <b>×${streak}</b></div><button class="pill" data-t="1">${T("chart")}</button></div></div>`}
function start(){track("quiz_start",{script,mode,order,lang});pool=getPool();queue=order==="seq"?pool.slice():shuffle(pool);idx=0;score=0;streak=0;best=0;wrong=[];render()}
function render(){
  clearTimeout(timer);
  if(idx>=queue.length)return end();
  cur=queue[idx];answered=false;setWm(cur[0]);
  const seen=new Set([cur[1]]);const mates=mode==="conf"?shuffle(confMates(cur[0])).map(c=>[c,RM[c]]):[];const others=mates.concat(shuffle(pool)).filter(p=>!seen.has(p[1])&&seen.add(p[1])).slice(0,3);
  const opts=shuffle([cur].concat(others));
  app.className="";
  app.innerHTML=`${topBar()}
  <div class="prog"><div class="lab"><span>${order==="seq"?T("practice"):T("quiz")}</span><span><b>${idx+1}</b> / ${queue.length}</span></div><div class="track"><i id="bar" style="width:${idx/queue.length*100}%"></i></div></div>
  <div class="stage"><div class="orb" id="orb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" pathLength="100"/></svg><div class="k kf">${cur[0]}</div></div></div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-r="${o[1]}"><small>${i+1}</small>${o[1]}</button>`).join("")}</div>
  <div class="foot" id="foot"></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById("bar");if(b)b.style.width=(idx+1)/queue.length*100+"%"}));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
}
function bump(id,html,hot){const p=document.getElementById(id);if(!p)return;p.querySelector("b").innerHTML=html;p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");if(hot!==undefined)p.classList.toggle("hot",hot)}
function pick(btn){
  if(answered)return;answered=true;
  const ok=btn.dataset.r===cur[1],orb=document.getElementById("orb");
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.r===cur[1])b.classList.add("ok");else if(b!==btn)b.classList.add("off")});
  if(ok){sfx("ok");score++;streak++;best=Math.max(best,streak);orb.classList.add("ok");bump("sc",score);bump("st","×"+streak,streak>=3);timer=setTimeout(next,1150)}
  else{sfx("bad");btn.classList.add("bad");streak=0;wrong.push(cur);orb.classList.add("bad");document.getElementById("st").classList.remove("hot");document.getElementById("st").querySelector("b").textContent="×0";
    document.getElementById("foot").innerHTML=`<button class="btn in" id="next">${T("next")}</button>`;document.getElementById("next").onclick=next}
}
function next(){if(!answered)return;answered=false;clearTimeout(timer);app.classList.add("leave");timer=setTimeout(()=>{idx++;render()},220)}
function modeChips(){
  const scr=[["hira","Hiragana"],["kata","Katakana"],["both",T("both")]].map(x=>`<button class="chip ${script===x[0]?"on":""}" data-s="${x[0]}">${x[1]}</button>`).join("");
  const sets=[["base",T("basic")],["dak",T("dak")],["all",T("all")],["conf",T("conf")]].map(m=>`<button class="chip ${mode===m[0]?"on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
  const ord=[["rand",T("rand")],["seq",T("seq")]].map(o=>`<button class="chip ${order===o[0]?"on":""}" data-o="${o[0]}">${o[1]}</button>`).join("");
  return`<div class="chips">${scr}</div><div class="chips">${sets}</div><div class="chips">${ord}</div>`;
}
function bindModes(){app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{if(c.dataset.s){script=c.dataset.s;try{localStorage.setItem("hq-script",script)}catch(e){}if(document.getElementById("go")){intro();return}}else if(c.dataset.m)mode=c.dataset.m;else order=c.dataset.o;app.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.s?x.dataset.s===script:x.dataset.m?x.dataset.m===mode:x.dataset.o===order));const p=document.getElementById("sub");if(p)p.textContent=T("sub")(getPool().length)})}
function intro(){
  clearTimeout(timer);app.className="";setWm(wmFirst());
  app.innerHTML=`<div class="top" style="justify-content:flex-end"><div class="topr"><button class="snd" id="snd" aria-label="sound">${sndOn?SND_ON:SND_OFF}</button><div class="lang"><button data-l="pl" class="${lang==="pl"?"on":""}">PL</button><button data-l="en" class="${lang==="en"?"on":""}">EN</button></div></div></div><div class="hero"><div class="big kf">${[...bigLabel()].map((c,i)=>`<span style="animation-delay:${i*.07}s">${c}</span>`).join("")}</div>
  <h2>${T("h2")(script)}</h2><p id="sub">${T("sub")(getPool().length)}</p>
  <div class="setup chips a" style="flex-direction:column;gap:0">${modeChips()}</div></div>
  <div class="foot2"><button class="btn" id="go">${T("start")}</button><button class="inst" id="inst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>${T("install")}</button><button class="link" data-t="1">${T("chartLink")}</button></div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  document.getElementById("inst").onclick=install;updInst();
  document.getElementById("snd").onclick=e=>{sndOn=!sndOn;try{localStorage.setItem("hq-snd",sndOn?"1":"0")}catch(_){}e.currentTarget.innerHTML=sndOn?SND_ON:SND_OFF;if(sndOn)sfx("ok")};
  bindModes();document.getElementById("go").onclick=start;
}
function end(){
  clearTimeout(timer);app.className="";setWm(script==="kata"?"ン":"ん");
  const pct=Math.round(score/queue.length*100);
  app.innerHTML=`${topBar()}<div class="hero end"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44" pathLength="100"/><circle class="fg" id="fg" cx="50" cy="50" r="44" pathLength="100" style="stroke-dashoffset:100"/></svg><div class="c"><b id="big">0</b><span>${T("of")(queue.length)}</span></div></div>
  <h2>${pct>=90?T("great"):pct>=60?T("good"):T("keep")}</h2><p>${T("stats")(pct,best)}</p>
  ${wrong.length?`<div class="miss">${wrong.map(w=>`<span><b class="kf">${w[0]}</b>${w[1]}</span>`).join("")}</div>`:`<p style="margin-top:12px">${T("flawless")}</p>`}
  <div class="setup chips a" style="flex-direction:column;gap:0;margin-top:22px">${modeChips()}</div></div>
  <div class="foot2"><button class="btn" id="again">${T("again")}</button><button class="link" id="menu">${T("menu")}</button></div>`;
  sfx("end");track("quiz_finish",{script,score,total:queue.length,pct,mode,order});
  const bg=document.getElementById("big"),fg=document.getElementById("fg"),t0=performance.now(),dur=1100;
  (function tick(n){const k=Math.min(1,Math.max(0,(n-t0-150)/dur)),e=1-Math.pow(1-k,3);bg.textContent=Math.round(score*e);fg.style.strokeDashoffset=100-pct*e;if(k<1)requestAnimationFrame(tick)})(t0);
  bindModes();document.getElementById("again").onclick=start;document.getElementById("menu").onclick=intro;
}
const RM={};BASE.concat(DAK,KBASE,KDAK).forEach(x=>RM[x[0]]=x[1]);RM["ぢ"]=RM["ヂ"]="ji";RM["づ"]=RM["ヅ"]="zu";
const ROWS=[["","あいうえお"],["k","かきくけこ"],["s","さしすせそ"],["t","たちつてと"],["n","なにぬねの"],["h","はひふへほ"],["m","まみむめも"],["y","や ゆ よ"],["r","らりるれろ"],["w","わ   を"],["","ん    "]];
const ROWS2=[["g","がぎぐげご"],["z","ざじずぜぞ"],["d","だぢづでど"],["b","ばびぶべぼ"],["p","ぱぴぷぺぽ"]];
function tbl(rows){
  const head="<tr><th></th>"+["a","i","u","e","o"].map(v=>`<th>${v}</th>`).join("")+"</tr>";
  return`<table class="tb">${head}${rows.map(r=>`<tr><th>${r[0]}</th>${[...r[1]].map(c=>c===" "?'<td class="e"></td>':`<td class="kf">${c}<small>${RM[c]}</small></td>`).join("")}</tr>`).join("")}</table>`;
}
const kRows=rows=>rows.map(r=>[r[0],[...r[1]].map(toK).join("")]);
function partsHtml(){return`<p class="pnote">${T("partNote")}</p><div class="plist">${T("parts").map(x=>`<div class="pc"><div class="pk kf">${x[0]}</div><div class="pb"><div class="pm"><b>${x[1]}</b> · ${x[2]}</div><div class="pe"><span class="kf">${x[3]}</span><i>${x[4]}</i><span>${x[5]}</span></div></div></div>`).join("")}</div>`}
let tview=null;
function buildTable(){
  if(!tview)tview=script==="kata"?"kata":"hira";
  const part=(a,b)=>`<h2>${T("tb1")}</h2>`+tbl(a)+`<h2>${T("tb2")}</h2>`+tbl(b);
  const body=tview==="hira"?part(ROWS,ROWS2):tview==="kata"?part(kRows(ROWS),kRows(ROWS2)):partsHtml();
  const tabs=[["hira","Hiragana"],["kata","Katakana"],["parts",T("partT")]].map(x=>`<button class="chip ${tview===x[0]?"on":""}" data-tv="${x[0]}">${x[1]}</button>`).join("");
  document.getElementById("ovbody").innerHTML=`<div class="chips tvs">${tabs}</div>`+body;
  document.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{tview=b.dataset.tv;buildTable();document.getElementById("ov").scrollTop=0});
}
const ov=document.getElementById("ov"),closeOv=()=>ov.classList.remove("on");
document.getElementById("ovx").onclick=closeOv;
document.addEventListener("click",e=>{if(e.target.closest("[data-t]")){tview=null;buildTable();ov.classList.add("on");ov.scrollTop=0}else if(e.target.closest("#back"))intro()});
document.addEventListener("keydown",e=>{
  if(sheet.classList.contains("on")){if(e.key==="Escape")closeSheet();return}
  if(ov.classList.contains("on")){if(e.key==="Escape")closeOv();return}
  if(e.key==="Escape"&&!document.getElementById("go")){intro();return}
  if(e.key>="1"&&e.key<="4"&&!answered){const b=app.querySelectorAll(".opt")[+e.key-1];if(b)pick(b)}
  else if((e.key==="Enter"||e.key===" ")&&answered){e.preventDefault();next()}
});
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isMobile=isIOS||/android/i.test(navigator.userAgent);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const installable=()=>!!document.querySelector('link[rel="manifest"]')&&!standalone()&&(deferredPrompt||isMobile);
function updInst(){const b=document.getElementById("inst");if(b)b.classList.toggle("on",!!installable())}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;updInst()});
addEventListener("appinstalled",()=>{deferredPrompt=null;updInst()});
const sheet=document.getElementById("sheet");
function closeSheet(){sheet.classList.remove("on")}
sheet.addEventListener("click",e=>{if(e.target===sheet||e.target.closest("#sheetok"))closeSheet()});
function install(){
  track("install_click",{platform:isIOS?"ios":isMobile?"android":"desktop",prompt:!!deferredPrompt});
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;updInst()});return}
  const k=isIOS?"ios":"and";
  document.getElementById("sheetin").innerHTML=`<h3>${T(k+"T")}</h3><p>${T(k+"P")}</p><ol>${T(k).map(x=>`<li><span>${x}</span></li>`).join("")}</ol><button class="btn" id="sheetok">${T("ok")}</button>`;
  sheet.classList.add("on");
}
function consentBar(){
  let c=null;try{c=localStorage.getItem("hq-consent")}catch(e){}
  if(c)return;
  const pl=lang==="pl",d=document.createElement("div");d.className="cc";
  d.innerHTML=`<p>${pl?"Używamy Google Analytics (pliki cookie), żeby wiedzieć, ile osób korzysta z apki. Bez reklam i bez sprzedawania danych.":"We use Google Analytics (cookies) to see how many people use the app. No ads, no selling data."}</p><div><button data-c="no">${pl?"Odrzuć":"Decline"}</button><button class="y" data-c="yes">${pl?"Akceptuj":"Accept"}</button></div>`;
  d.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;const v=b.dataset.c;try{localStorage.setItem("hq-consent",v)}catch(_){}if(v==="yes"&&window.gtag)gtag("consent","update",{analytics_storage:"granted"});d.remove()});
  document.body.appendChild(d);
}
applyLang();intro();consentBar();
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
