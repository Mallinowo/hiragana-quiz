:root{--bg:#0f1016;--ink:#f4f1ea;--mute:#8b8e9b;--dim:#5a5d69;--surf:rgba(255,255,255,.045);--surf2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--acc:#ff5a45;--ok:#3ddc97;--bad:#ff5468;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.kf{font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Klee One","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;contain:strict;transform:translateZ(0)}
.sun{position:absolute;left:50%;top:-18vh;width:120vh;height:120vh;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,90,69,.22) 0%,rgba(255,90,69,.07) 35%,transparent 62%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.06);opacity:.85}}
.wm{position:absolute;right:-12vh;bottom:-14vh;font-size:78vh;line-height:1;color:#fff;opacity:.035;animation:wm .6s ease-out both;will-change:opacity}
@keyframes wm{from{opacity:0}}
@keyframes drift{to{transform:translate(-3vh,-2vh) rotate(2deg)}}
.grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.6) .6px,transparent .6px);background-size:3px 3px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px;transition:background .2s}
.back:hover{background:var(--surf2)}
.lft{display:flex;align-items:center;gap:12px}
.logo{white-space:nowrap}
@media(max-width:460px){.logo span{display:none}.pills{gap:6px}.pill{padding:7px 10px}}
.lang{display:flex;padding:3px;border-radius:99px;background:var(--surf);border:1px solid var(--line)}
.lang button{font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border:0;border-radius:99px;background:transparent;color:var(--mute);cursor:pointer;transition:all .2s}
.lang button.on{background:var(--acc);color:#fff}
.snd{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.snd svg{width:18px;height:18px}
.topr{display:flex;gap:8px;align-items:center}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.02em}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.pill b{color:var(--ink);font-weight:700}
.pill.hot{color:var(--acc);border-color:rgba(255,90,69,.4);background:rgba(255,90,69,.1)}
.pill.hot b{color:var(--acc)}
.pill.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.18)}}
button.pill{cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.prog{margin-top:22px}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:8px;letter-spacing:.04em}
.prog .lab b{color:var(--ink)}
.track{height:6px;border-radius:6px;background:var(--surf2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff8a5c,var(--acc));box-shadow:0 0 12px rgba(255,90,69,.6);transition:width .6s var(--ease)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.orb{position:relative;width:min(72vw,300px,38vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.07),rgba(255,255,255,.015) 70%);border:1px solid var(--line);animation:orbIn .5s var(--ease) both}
@keyframes orbIn{from{transform:scale(.94);opacity:.4}}
.orb svg{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg)}
.orb circle{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.orb.ok circle{stroke:var(--ok);animation:draw .55s var(--ease) forwards}
.orb::after{content:"";position:absolute;inset:-18%;border-radius:50%;pointer-events:none;background:radial-gradient(circle closest-side,transparent 70%,rgba(61,220,151,.22) 78%,transparent 100%);opacity:0;transition:opacity .45s}
.orb.ok::after{opacity:1}
.orb.bad::after{background:radial-gradient(circle closest-side,transparent 70%,rgba(255,84,104,.2) 78%,transparent 100%);opacity:1}
.orb.bad circle{stroke:var(--bad);stroke-dashoffset:0;animation:fadeIn .2s both}
.orb.bad{animation:shake .4s ease}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
.orb .k{font-size:min(36vw,150px,19vh);line-height:1;animation:stamp .45s var(--ease) both;will-change:transform,opacity}
@keyframes stamp{from{opacity:0;transform:scale(1.3)}}
.orb.ok .k{color:var(--ok);transition:color .25s}
.ans{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:700;color:var(--bad);letter-spacing:.03em;animation:up .3s var(--ease) both}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;font:inherit;font-size:26px;font-weight:600;height:clamp(64px,10vh,84px);border-radius:20px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,color .2s,opacity .25s,transform .15s;animation:optIn .45s var(--ease) both}
.opt:nth-child(1){animation-delay:.12s}.opt:nth-child(2){animation-delay:.17s}.opt:nth-child(3){animation-delay:.22s}.opt:nth-child(4){animation-delay:.27s}
@keyframes optIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
.opt small{position:absolute;top:9px;left:12px;font-size:11px;font-weight:600;color:var(--dim)}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.22);background:var(--surf2)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.ok{background:rgba(61,220,151,.14);border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 4px rgba(61,220,151,.08);animation:pop .4s var(--spring)}
.opt.bad{background:rgba(255,84,104,.13);border-color:var(--bad);color:var(--bad);animation:shake .4s ease}
.opt.off{opacity:.35}
.opt.ok small,.opt.bad small{color:inherit;opacity:.7}
@keyframes pop{45%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.foot{height:74px;display:flex;align-items:flex-end}
.btn{width:100%;height:58px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,90,69,.35);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn.in{animation:up .35s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.leave .orb,.leave .opts{animation:leave .22s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(-28px)}}
.leave .orb{animation-name:leaveO}
@keyframes leaveO{to{opacity:0;transform:scale(.9)}}
.hero{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .big{font-size:min(22vw,104px);line-height:1.05;position:relative}
.hero .big span{display:inline-block;animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) rotate(-6deg)}}
.hero h2{font-size:min(9vw,40px);font-weight:800;letter-spacing:-.02em;margin:26px 0 8px;animation:up .5s var(--ease) .35s both}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;color:var(--mute);font-size:15px;animation:up .5s var(--ease) .45s both}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chips.a{animation:up .5s var(--ease) .55s both}
.chip{font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(255,90,69,.1)}
.setup{margin:30px 0 0}
.foot2{display:flex;flex-direction:column;gap:12px;animation:up .5s var(--ease) .65s both}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px}
.ring{position:relative;width:min(58vw,230px);aspect-ratio:1;animation:orbIn .5s var(--ease) both}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:var(--surf2)}
.ring .fg{stroke:var(--acc);stroke-dasharray:100}
.ring::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle closest-side,transparent 68%,rgba(255,90,69,.2) 78%,transparent 100%)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:min(15vw,60px);font-weight:800;letter-spacing:-.03em}
.ring .c span{font-size:14px;color:var(--mute);font-weight:600}
.end h2{margin-top:22px}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;animation:up .5s var(--ease) .5s both}
.miss span{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mute)}
.miss b{font-size:22px;color:var(--ink);font-weight:600}
.hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}
@media(max-width:520px),(max-height:700px){.hint{display:none}}
.ov{position:fixed;inset:0;background:rgba(15,16,22,.97);overflow:auto;padding:20px;display:none;z-index:10}
.ov.on{display:block;animation:fadeIn .2s both}
.ovin{max-width:560px;margin:0 auto}
.ovtop{z-index:3;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:-20px;background:rgba(15,16,22,.97);padding:10px 0}
.ovtop h1{font-size:16px;margin:0}
table.tb{border-collapse:separate;border-spacing:5px;width:100%;table-layout:fixed;margin-bottom:22px}
.tb th{font-size:12px;color:var(--mute);font-weight:600;padding:2px;width:9%}
.tb td{background:var(--surf);border:1px solid var(--line);border-radius:12px;height:62px;position:relative;text-align:center;font-size:30px}
.tb td small{position:absolute;right:7px;bottom:4px;font-size:11px;font-family:Inter,system-ui,sans-serif;font-weight:600;color:var(--mute)}
.tb td.e{background:transparent;border:0}
.ov h2{font-size:12px;color:var(--mute);margin:6px 0;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tap{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;z-index:50;animation:tap .45s ease-out forwards}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}

.wm{color:var(--ink);opacity:.045}
.logo i{border-radius:4px;box-shadow:none;width:13px;height:13px}
.back{background:var(--surf);color:var(--ink)}
.back:hover{background:var(--surf2)}
.pill{background:var(--surf);color:var(--mute)}
.pill.hot{background:rgba(200,55,45,.08)}
.lang{background:var(--surf)}
.track{background:rgba(34,29,23,.08)}
.track i{background:var(--acc);box-shadow:none}
.orb{background:var(--surf);border:1px solid var(--line);box-shadow:0 10px 24px -16px rgba(60,40,20,.35)}
.orb::after{display:none}
.orb svg{inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px)}
.orb circle{stroke-width:3.2}
.orb.ok circle{stroke:var(--good)}
.orb.ok .k{color:var(--ink)}
.orb.bad circle{stroke:var(--wrong)}
.ans{color:var(--acc)}
.opt{background:var(--surf);color:var(--ink);box-shadow:0 2px 0 rgba(34,29,23,.06)}
.opt small{color:var(--dim)}
.opt:hover:not(:disabled){background:var(--surf2);border-color:rgba(34,29,23,.28)}
.opt.ok{background:rgba(47,143,84,.12);border-color:var(--good);color:var(--good);box-shadow:0 0 0 4px rgba(47,143,84,.1)}
.opt.bad{background:rgba(200,55,45,.1);border-color:var(--wrong);color:var(--wrong);text-decoration:line-through;text-decoration-thickness:2px}
.opt.off{opacity:.4}
.btn{background:var(--acc);box-shadow:0 3px 0 #922820}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #922820}
.hero h2 em{color:var(--acc)}
.chip{color:var(--mute)}
.chip.on{background:rgba(200,55,45,.07)}
.ring::before{display:none}
.ring .bgc{stroke:rgba(34,29,23,.09)}
.ring .fg{stroke:var(--acc)}
.miss span{background:var(--surf)}
.ov{background:rgba(243,238,227,.98)}
.ovtop{background:rgba(243,238,227,.98)}
.tb td{background:var(--surf)}
.tap{background:rgba(34,29,23,.2)}
.inst{display:none;width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:16px;font-weight:700;cursor:pointer;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 0 rgba(34,29,23,.06)}
.inst.on{display:flex}
.inst svg{width:20px;height:20px}
.sheetbg{position:fixed;inset:0;background:rgba(34,29,23,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheetbg.on{display:flex;animation:fadeIn .2s both}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));animation:up .3s var(--ease) both}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:800}
.sheet p{margin:0 0 18px;color:var(--mute);font-size:14px}
.sheet ol{margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
.sheet li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.sheet li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.sheet b{font-weight:700}
.pnote{font-size:13px;color:var(--mute);margin:6px 0 12px}
.tvs{justify-content:flex-start;margin:0 0 14px;position:sticky;top:34px;z-index:2;background:rgba(243,238,227,.98);padding:6px 0}
.pnote b{color:var(--acc)}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.pc{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pk{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(200,55,45,.08);color:var(--acc);display:grid;place-items:center;font-size:28px}
.pb{min-width:0}
.pm{font-size:14px;color:var(--ink)}
.pm b{color:var(--acc);font-weight:800}
.pe{font-size:13px;color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;gap:0 8px}
.pe .kf{color:var(--ink);font-size:15px}
.rcard{width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:24px;padding:30px 18px 24px;text-align:center;box-shadow:0 10px 24px -16px rgba(60,40,20,.35);animation:orbIn .5s var(--ease) both;transition:border-color .2s}
.rk{font-size:min(15vw,64px);line-height:1.35;animation:vplIn .45s var(--ease) both;word-break:keep-all}
.rk{max-width:100%;overflow-wrap:anywhere}
.rk.nk{word-break:keep-all;overflow-wrap:normal;font-size:min(7vw,30px)}
.rt b{overflow-wrap:anywhere}
.nopts .opt span{word-break:keep-all;overflow-wrap:normal}
.nopts .opt{font-size:min(5.2vw,20px)}
#app.numq .stage{flex:1 0 auto;margin:14px 0}
#app.numq .rcard{padding:22px 16px 18px}
.rk.long{font-size:min(7.4vw,30px);line-height:1.6}
.rcard.ok{border-color:var(--good);box-shadow:0 0 0 4px rgba(47,143,84,.12)}

function numPieces(n,naive){

  const th=Math.floor(r/1000),hu=Math.floor(r%1000/100),te=Math.floor(r%100/10),un=r%10;
  if(th){if(th===1)P.push(["せん","sen"]);else if(!naive&&TH_IRR[th])P.push(TH_IRR[th]);else{P.push(ND[th]);P.push(["せん","sen"])}}
