let lang="pl";try{const v=localStorage.getItem("hq-lang");if(v==="en"||v==="pl")lang=v;else if(!(navigator.language||"").startsWith("pl"))lang="en"}catch(e){}
const T=k=>L[lang][k];
function applyLang(){document.documentElement.lang=lang;document.title=T("title");document.getElementById("ovh").textContent=T("ovh");document.getElementById("ovx").textContent=T("close");document.getElementById("hint").textContent=T("hint");buildTable()}
function setLang(l){lang=l;try{localStorage.setItem("hq-lang",l)}catch(e){}applyLang();intro()}
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
let sndOn=true;try{sndOn=localStorage.getItem("hq-snd")!=="0"}catch(e){}
let actx=null;
function track(n,p){try{if(window.gtag)gtag("event",n,p||{})}catch(e){}}
function sfx(kind){
  if(!sndOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime,out=actx.createGain();out.gain.value=.5;out.connect(actx.destination);
    const tone=(f,st,dur,vol,type)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(vol,t+st+.008);g.gain.exponentialRampToValueAtTime(.0001,t+st+dur);o.connect(g);g.connect(out);o.start(t+st);o.stop(t+st+dur+.05)};
    if(kind==="ok"){tone(1318.5,0,.45,.35);tone(1975.5,.07,.55,.28)}
    else if(kind==="bad"){tone(196,0,.28,.3,"triangle");tone(185,0,.28,.25,"triangle");tone(147,.12,.3,.25,"triangle")}
    else if(kind==="end"){[659.3,784,987.8,1318.5].forEach((f,i)=>tone(f,i*.09,.9,.25))}
    else if(kind==="tap"){tone(2400,0,.04,.12)}
  }catch(e){}
}
const app=document.getElementById("app"),wm=document.getElementById("wm");
let mode="base",order="rand",pool=[],queue=[],idx=0,score=0,streak=0,best=0,answered=false,wrong=[],cur=null,timer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const getPool=()=>mode==="base"?BASE:mode==="dak"?DAK:BASE.concat(DAK);
function setWm(c){wm.textContent=c;wm.style.animation="none";void wm.offsetWidth;wm.style.animation=""}
function topBar(){return`<div class="top"><div class="lft"><button class="back" id="back" title="${T("back")}" aria-label="${T("back")}">‹</button><div class="logo"><i></i><span>ひらがな</span></div></div><div class="pills"><div class="pill" id="sc">${T("score")} <b>${score}</b></div><div class="pill ${streak>=3?"hot":""}" id="st">${T("streak")} <b>×${streak}</b></div><button class="pill" data-t="1">${T("chart")}</button></div></div>`}
function start(){track("quiz_start",{mode,order,lang});pool=getPool();queue=order==="seq"?pool.slice():shuffle(pool);idx=0;score=0;streak=0;best=0;wrong=[];render()}
function render(){
  clearTimeout(timer);
  if(idx>=queue.length)return end();
  cur=queue[idx];answered=false;setWm(cur[0]);
  const others=shuffle(pool.filter(p=>p[1]!==cur[1])).slice(0,3);
  const opts=shuffle([cur].concat(others));
  app.className="";
  app.innerHTML=`${topBar()}
  <div class="prog"><div class="lab"><span>${order==="seq"?T("practice"):T("quiz")}</span><span><b>${idx+1}</b> / ${queue.length}</span></div><div class="track"><i id="bar" style="width:${idx/queue.length*100}%"></i></div></div>
  <div class="stage"><div class="orb" id="orb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" pathLength="100"/></svg><div class="k kf">${cur[0]}</div></div></div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-r="${o[1]}"><small>${i+1}</small>${o[1]}</button>`).join("")}</div>
  <div class="foot" id="foot"></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById("bar");if(b)b.style.width=(idx+1)/queue.length*100+"%"}));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
}
function bump(id,html,hot){const p=document.getElementById(id);if(!p)return;p.querySelector("b").innerHTML=html;p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump");if(hot!==undefined)p.classList.toggle("hot",hot)}
function pick(btn){
  if(answered)return;answered=true;
  const ok=btn.dataset.r===cur[1],orb=document.getElementById("orb");
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.r===cur[1])b.classList.add("ok");else if(b!==btn)b.classList.add("off")});
  if(ok){sfx("ok");score++;streak++;best=Math.max(best,streak);orb.classList.add("ok");bump("sc",score);bump("st","×"+streak,streak>=3);timer=setTimeout(next,1150)}
  else{sfx("bad");btn.classList.add("bad");streak=0;wrong.push(cur);orb.classList.add("bad");document.getElementById("st").classList.remove("hot");document.getElementById("st").querySelector("b").textContent="×0";
    document.getElementById("foot").innerHTML=`<button class="btn in" id="next">${T("next")}</button>`;document.getElementById("next").onclick=next}
}
function next(){if(!answered)return;answered=false;clearTimeout(timer);app.classList.add("leave");timer=setTimeout(()=>{idx++;render()},220)}
function modeChips(){
  const sets=[["base",T("basic")],["dak",T("dak")],["all",T("all")]].map(m=>`<button class="chip ${mode===m[0]?"on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
  const ord=[["rand",T("rand")],["seq",T("seq")]].map(o=>`<button class="chip ${order===o[0]?"on":""}" data-o="${o[0]}">${o[1]}</button>`).join("");
  return`<div class="chips">${sets}</div><div class="chips">${ord}</div>`;
}
function bindModes(){app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{if(c.dataset.m)mode=c.dataset.m;else order=c.dataset.o;app.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.m?x.dataset.m===mode:x.dataset.o===order));const p=document.getElementById("sub");if(p)p.textContent=T("sub")(getPool().length)})}
function intro(){
  clearTimeout(timer);app.className="";setWm("あ");
  app.innerHTML=`<div class="top" style="justify-content:flex-end"><div class="topr"><button class="snd" id="snd" aria-label="sound">${sndOn?SND_ON:SND_OFF}</button><div class="lang"><button data-l="pl" class="${lang==="pl"?"on":""}">PL</button><button data-l="en" class="${lang==="en"?"on":""}">EN</button></div></div></div><div class="hero"><div class="big kf">${[..."ひらがな"].map((c,i)=>`<span style="animation-delay:${i*.07}s">${c}</span>`).join("")}</div>
  <h2>${T("h2")}</h2><p id="sub">${T("sub")(getPool().length)}</p>
  <div class="setup chips a" style="flex-direction:column;gap:0">${modeChips()}</div></div>
  <div class="foot2"><button class="btn" id="go">${T("start")}</button><button class="inst" id="inst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>${T("install")}</button><button class="link" data-t="1">${T("chartLink")}</button></div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  document.getElementById("inst").onclick=install;updInst();
  document.getElementById("snd").onclick=e=>{sndOn=!sndOn;try{localStorage.setItem("hq-snd",sndOn?"1":"0")}catch(_){}e.currentTarget.innerHTML=sndOn?SND_ON:SND_OFF;if(sndOn)sfx("ok")};
  bindModes();document.getElementById("go").onclick=start;
}
function end(){
  clearTimeout(timer);app.className="";setWm("ん");
  const pct=Math.round(score/queue.length*100);
  app.innerHTML=`${topBar()}<div class="hero end"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44" pathLength="100"/><circle class="fg" id="fg" cx="50" cy="50" r="44" pathLength="100" style="stroke-dashoffset:100"/></svg><div class="c"><b id="big">0</b><span>${T("of")(queue.length)}</span></div></div>
  <h2>${pct>=90?T("great"):pct>=60?T("good"):T("keep")}</h2><p>${T("stats")(pct,best)}</p>
  ${wrong.length?`<div class="miss">${wrong.map(w=>`<span><b class="kf">${w[0]}</b>${w[1]}</span>`).join("")}</div>`:`<p style="margin-top:12px">${T("flawless")}</p>`}
  <div class="setup chips a" style="flex-direction:column;gap:0;margin-top:22px">${modeChips()}</div></div>
  <div class="foot2"><button class="btn" id="again">${T("again")}</button><button class="link" id="menu">${T("menu")}</button></div>`;
  sfx("end");track("quiz_finish",{score,total:queue.length,pct,mode,order});
  const bg=document.getElementById("big"),fg=document.getElementById("fg"),t0=performance.now(),dur=1100;
  (function tick(n){const k=Math.min(1,Math.max(0,(n-t0-150)/dur)),e=1-Math.pow(1-k,3);bg.textContent=Math.round(score*e);fg.style.strokeDashoffset=100-pct*e;if(k<1)requestAnimationFrame(tick)})(t0);
  bindModes();document.getElementById("again").onclick=start;document.getElementById("menu").onclick=intro;
}
const RM={};BASE.concat(DAK).forEach(x=>RM[x[0]]=x[1]);RM["ぢ"]="ji";RM["づ"]="zu";
const ROWS=[["","あいうえお"],["k","かきくけこ"],["s","さしすせそ"],["t","たちつてと"],["n","なにぬねの"],["h","はひふへほ"],["m","まみむめも"],["y","や ゆ よ"],["r","らりるれろ"],["w","わ   を"],["","ん    "]];
const ROWS2=[["g","がぎぐげご"],["z","ざじずぜぞ"],["d","だぢづでど"],["b","ばびぶべぼ"],["p","ぱぴぷぺぽ"]];
function tbl(rows){
  const head="<tr><th></th>"+["a","i","u","e","o"].map(v=>`<th>${v}</th>`).join("")+"</tr>";
  return`<table class="tb">${head}${rows.map(r=>`<tr><th>${r[0]}</th>${[...r[1]].map(c=>c===" "?'<td class="e"></td>':`<td class="kf">${c}<small>${RM[c]}</small></td>`).join("")}</tr>`).join("")}</table>`;
}
function buildTable(){document.getElementById("ovbody").innerHTML=`<h2>${T("tb1")}</h2>`+tbl(ROWS)+`<h2>${T("tb2")}</h2>`+tbl(ROWS2)}
const ov=document.getElementById("ov"),closeOv=()=>ov.classList.remove("on");
document.getElementById("ovx").onclick=closeOv;
document.addEventListener("click",e=>{if(e.target.closest("[data-t]")){ov.classList.add("on");ov.scrollTop=0}else if(e.target.closest("#back"))intro()});
document.addEventListener("keydown",e=>{
  if(sheet.classList.contains("on")){if(e.key==="Escape")closeSheet();return}
  if(ov.classList.contains("on")){if(e.key==="Escape")closeOv();return}
  if(e.key==="Escape"&&!document.getElementById("go")){intro();return}
  if(e.key>="1"&&e.key<="4"&&!answered){const b=app.querySelectorAll(".opt")[+e.key-1];if(b)pick(b)}
  else if((e.key==="Enter"||e.key===" ")&&answered){e.preventDefault();next()}
});
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isMobile=isIOS||/android/i.test(navigator.userAgent);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const installable=()=>!!document.querySelector('link[rel="manifest"]')&&!standalone()&&(deferredPrompt||isMobile);
function updInst(){const b=document.getElementById("inst");if(b)b.classList.toggle("on",!!installable())}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;updInst()});
addEventListener("appinstalled",()=>{deferredPrompt=null;updInst()});
const sheet=document.getElementById("sheet");
function closeSheet(){sheet.classList.remove("on")}
sheet.addEventListener("click",e=>{if(e.target===sheet||e.target.closest("#sheetok"))closeSheet()});
function install(){
  track("install_click",{platform:isIOS?"ios":isMobile?"android":"desktop",prompt:!!deferredPrompt});
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;updInst()});return}
  const k=isIOS?"ios":"and";
  document.getElementById("sheetin").innerHTML=`<h3>${T(k+"T")}</h3><p>${T(k+"P")}</p><ol>${T(k).map(x=>`<li><span>${x}</span></li>`).join("")}</ol><button class="btn" id="sheetok">${T("ok")}</button>`;
  sheet.classList.add("on");
}
function consentBar(){
  let c=null;try{c=localStorage.getItem("hq-consent")}catch(e){}
  if(c)return;
  const pl=lang==="pl",d=document.createElement("div");d.className="cc";
  d.innerHTML=`<p>${pl?"Używamy Google Analytics (pliki cookie), żeby wiedzieć, ile osób korzysta z apki. Bez reklam i bez sprzedawania danych.":"We use Google Analytics (cookies) to see how many people use the app. No ads, no selling data."}</p><div><button data-c="no">${pl?"Odrzuć":"Decline"}</button><button class="y" data-c="yes">${pl?"Akceptuj":"Accept"}</button></div>`;
  d.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;const v=b.dataset.c;try{localStorage.setItem("hq-consent",v)}catch(_){}if(v==="yes"&&window.gtag)gtag("consent","update",{analytics_storage:"granted"});d.remove()});

if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
